<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JsEngine 3D</title>
    <script src="coi-serviceworker.js"></script>
    <link rel="stylesheet" href="demo.css">
</head>
<body>
<div id="terminal"></div>
<div id="focus-hint">Click the terminal to give it the keyboard</div>
<button id="play" type="button" autofocus>
    <h1>JsEngine 3D</h1>
    <p>A software rasterizer drawing lit, textured OBJ meshes into terminal cells, run in a Web Worker and split
        across raster threads where the page is cross-origin isolated. The large bugatti downloads only when you
        select it with <kbd>n</kbd>. Open the page with <code>?backend=pixels</code> to draw into an RGBA framebuffer
        instead of cells, or <code>?backend=gpu</code> for the experimental WebGPU renderer.</p>
    <p><kbd>wasd</kbd> move &middot; <kbd>q</kbd>/<kbd>e</kbd> down/up &middot; drag to look &middot; wheel or
        <kbd>z</kbd>/<kbd>x</kbd> zoom &middot; <kbd>esc</kbd> stop</p>
    <p><kbd>space</kbd> spawn &middot; <kbd>backspace</kbd> despawn &middot; <kbd>n</kbd> next model &middot;
        <kbd>r</kbd> reload models &middot; <kbd>arrows</kbd> rotate &middot; <kbd>[</kbd>/<kbd>]</kbd> shrink/grow</p>
    <p><kbd>h</kbd> lights &middot; <kbd>p</kbd> lamp &middot; <kbd>ijkl</kbd> turn the sun &middot; <kbd>t</kbd>
        textures &middot; <kbd>f</kbd> LOD &middot; <kbd>-</kbd>/<kbd>=</kbd> less/more detail &middot; <kbd>1</kbd>-<kbd>4</kbd>
        anti-aliasing &middot; <kbd>y</kbd> render pacing &middot; <kbd>v</kbd> meshes on/off &middot; <kbd>tab</kbd> HUD
        &middot; <kbd>g</kbd> log system order</p>
    <p>Cells only: <kbd>b</kbd> half-block. WebGPU only: <kbd>m</kbd> texture filtering &middot; <kbd>o</kbd> surface
        shader.</p>
    <span class="start">Click to play</span>
</button>
<script type="module" src="3d.js"></script>
</body>
</html>
