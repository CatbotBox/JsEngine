<!doctype html>
<html lang="en" data-default-backend="{{defaultBackend}}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}}</title>
    <script src="{{isolationScript}}"></script>
    <link rel="stylesheet" href="{{stylesheet}}">
</head>
<body>
<div id="terminal"></div>
<div id="focus-hint">Click the terminal to give it the keyboard</div>
<button id="play" type="button" autofocus>
    <h1>{{title}}</h1>
    <span class="start">Click to play</span>
</button>
<script type="module" src="{{script}}"></script>
</body>
</html>
