<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Swarm</title>
    <link rel="stylesheet" href="demo.css">
</head>
<body>
<div id="terminal"></div>
<div id="focus-hint">Click the terminal to give it the keyboard</div>
<button id="play" type="button" autofocus>
    <h1>Swarm</h1>
    <p>A twin-stick survival game on the JsEngine ECS. Waves of enemies close in from every edge; keep moving, keep
        firing, and save the bomb for when they get too close.</p>
    <p><kbd>wasd</kbd> move &middot; <kbd>arrows</kbd> fire &middot; <kbd>space</kbd> bomb &middot; <kbd>enter</kbd>
        start &middot; <kbd>r</kbd> restart &middot; <kbd>tab</kbd> HUD &middot; <kbd>esc</kbd> quit</p>
    <span class="start">Click to play</span>
</button>
<script type="module" src="swarm.js"></script>
</body>
</html>
